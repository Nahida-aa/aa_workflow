[package]
name = "example_store_file"
version = "0.1.0"
edition = "2024"
publish = false
description = "File-backed durable execution store for aa-workflow (implements WorkflowExecutionStore)"

[dependencies]
aa_workflow_core = { path = "../../packages/workflow_core" }
aa_workflow_runtime = { path = "../../packages/workflow_runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
