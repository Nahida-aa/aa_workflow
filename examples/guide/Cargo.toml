[package]
name = "example_guide"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runnable port of TanStack Workflow's guide/index.md (sections 1, 2, 5, 6)"

[dependencies]
aa_workflow_core = { path = "../../packages/workflow_core" }
aa_workflow_runtime = { path = "../../packages/workflow_runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"
