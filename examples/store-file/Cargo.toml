[package]
name = "workflow-store-file"
version = "0.1.0"
edition = "2024"
publish = false
description = "File-backed durable execution store for aa-workflow (implements WorkflowExecutionStore)"

[dependencies]
workflow-core = { path = "../../packages/workflow-core" }
workflow-runtime = { path = "../../packages/workflow-runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
