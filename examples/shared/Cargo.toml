[package]
name = "workflow-examples-shared"
version = "0.1.0"
edition = "2024"
publish = false
description = "Host-agnostic example layer for workflow-core (workflows + run-store + runtime glue)"

[dependencies]
workflow-core = { path = "../../packages/workflow-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"