[package]
name = "example_shared"
version = "0.1.0"
edition = "2024"
publish = false
description = "Host-agnostic example layer for aa_workflow_core (workflows + run-store + runtime glue)"

[dependencies]
aa_workflow_core = { path = "../../packages/workflow_core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"