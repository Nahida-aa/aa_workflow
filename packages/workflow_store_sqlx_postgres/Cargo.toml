[package]
name = "aa_workflow_store_sqlx_postgres"
version = "0.1.0"
edition = "2024"
description = "Postgres durable execution store for aa-workflow, implementing WorkflowExecutionStore"

[dependencies]
aa_workflow_core = { path = "../workflow_core" }
aa_workflow_runtime = { path = "../workflow_runtime" }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "json",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
