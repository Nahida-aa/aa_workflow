[package]
name = "aa_workflow_core"
version = "0.2.0"
edition = "2024"
description = "headless durable execution"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
# `Stream` trait only (no executor, no combinators) — `RunEventStream` 手写
# `poll_next`，对齐上游 `AsyncIterable<WorkflowEvent>`。
futures-core = "0.3"
