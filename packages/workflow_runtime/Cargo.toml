[package]
name = "aa_workflow_runtime"
version = "0.1.0"
edition = "2024"
description = "Execution ownership layer for aa_workflow_core: leases, sweep, timers, schedules"

[dependencies]
aa_workflow_core = { path = "../workflow_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
