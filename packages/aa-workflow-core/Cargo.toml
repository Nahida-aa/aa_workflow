[package]
name = "aa-workflow-core"
version = "0.2.0"
edition = "2024"
description = "headless durable execution"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
